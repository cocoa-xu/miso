name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
      - name: Run unit tests
        run: make test-unit
      - name: Verify Spotlight policy on a disposable APFS volume
        run: |
          sudo env DEVELOPER_DIR="$DEVELOPER_DIR" \
            MISO_SPOTLIGHT_TEST_OUTPUT="$RUNNER_TEMP/spotlight-policy" \
            xcrun swift test --disable-automatic-resolution --skip-build \
            --filter nativeSpotlightVolumePolicy --no-parallel
