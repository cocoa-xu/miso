name: Image build test

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: image-build-test
  cancel-in-progress: false

jobs:
  image:
    runs-on: xcode-27
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect build host
        run: |
          mkdir -p "$RUNNER_TEMP/image-evidence"
          bash Scripts/ci-image.sh host 2>&1 | tee "$RUNNER_TEMP/image-evidence/host.txt"
      - name: Build MISO
        timeout-minutes: 15
        run: make build 2>&1 | tee "$RUNNER_TEMP/image-evidence/build-miso.log"
      - name: Prepare runner and publication tools
        timeout-minutes: 15
        run: bash Scripts/ci-image.sh prepare 2>&1 | tee "$RUNNER_TEMP/image-evidence/prepare.log"
      - name: Download verified restore inputs
        timeout-minutes: 60
        run: bash Scripts/ci-image.sh download 2>&1 | tee "$RUNNER_TEMP/image-evidence/download.log"
      - name: Build and export Vanilla without a VM
        timeout-minutes: 90
        run: bash Scripts/ci-image.sh build 2>&1 | tee "$RUNNER_TEMP/image-evidence/build-image.log"
      - name: Publish OCI image
        timeout-minutes: 45
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: ${{ github.actor }}
          TART_REGISTRY_PASSWORD: ${{ github.token }}
        run: bash Scripts/ci-image.sh publish 2>&1 | tee "$RUNNER_TEMP/image-evidence/publish.log"
      - name: Download and verify published image
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: ${{ github.actor }}
          TART_REGISTRY_PASSWORD: ${{ github.token }}
        run: bash Scripts/ci-image.sh verify 2>&1 | tee "$RUNNER_TEMP/image-evidence/verify.log"
      - name: Collect build status
        if: always()
        run: bash Scripts/ci-image.sh collect
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-evidence
          retention-days: 7
